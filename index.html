<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nilfisk Arıza Kodları</title>

  <!-- PWA Bağlantıları -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">

  <style>
/* Kapsayıcıyı ekran genişliğine göre esnek yapalım */
    .container { 
      max-width: 900px; /* Geniş ekranlarda daha fazla açılması için yükselttik */
      width: 100%; 
      margin: 0 auto; 
    }

    /* YATAY EKRAN (LANDSCAPE) MODU ÖZEL AYARLARI */
    @media (orientation: landscape) {
      body {
        padding: 10px 25px; /* Yanlardan rahatlama payı */
      }
      .container {
        max-width: 100%; /* Telefon yatayken ekranın tamamını kaplar */
      }
      .error-table th, .error-table td {
        padding: 10px 18px; /* Yatayda yükseklikten kazanmak için dikey dolguyu biraz azalttık */
      }
      .desc-cell .detail {
        font-size: 15px; /* Yatay ekranda okunabilirliği korur */
      }
    }

    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f3f4f6; margin: 0; padding: 15px; }
    .container { max-width: 650px; margin: 0 auto; }
    
    /* Header & Başlık */
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    h1 { color: #1e293b; margin: 0; font-size: 24px; } /* 22px -> 24px */
    .btn-back {
      background: #e2e8f0; border: none; padding: 10px 16px;
      border-radius: 6px; font-weight: bold; cursor: pointer; color: #475569; font-size: 16px;
    }
    
    /* Makine Seçim Ekranı Grid */
    .machine-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-top: 20px; }
    .machine-card {
      background: white; padding: 22px; border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center;
      cursor: pointer; border: 2px solid transparent; transition: all 0.2s;
    }
    .machine-card:hover { border-color: #2563eb; transform: translateY(-2px); }
    .machine-title { font-size: 24px; font-weight: bold; color: #1e293b; } /* 22px -> 24px */
    .machine-subtitle { color: #64748b; font-size: 16px; margin-top: 5px; } /* 14px -> 16px */

    /* Arama Çubuğu */
    .search-box {
      width: 100%; padding: 14px; font-size: 18px; /* 16px -> 18px */
      border: 2px solid #cbd5e1; border-radius: 8px; margin-bottom: 20px; outline: none;
    }
    .search-box:focus { border-color: #2563eb; }

    /* TABLO TASARIMI */
    .error-table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .error-table th, .error-table td {
      padding: 14px 16px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }
    .error-table th {
      background-color: #2563eb;
      color: white;
      font-size: 17px; /* 15px -> 17px */
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .error-table tr:last-child td { border-bottom: none; }
    .error-table tr:hover { background-color: #f8fafc; }

    /* Sol Sütun (Kod) */
    .code-cell {
      width: 120px;
      font-weight: bold;
      color: #dc2626;
      font-size: 17px; /* 15px -> 17px */
      vertical-align: top;
      white-space: nowrap;
    }

    /* Sağ Sütun (Açıklama) */
    .desc-cell .title { font-weight: bold; color: #1e293b; font-size: 17px; margin-bottom: 4px; } /* 15px -> 17px */
    .desc-cell .detail { color: #475569; font-size: 16px; line-height: 1.4; } /* 14px -> 16px */
    
    /* Gizleme Sınıfı */
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 1. EKRAN: MAKİNE SEÇİMİ -->
    <div id="selectionScreen">
      <h1 style="text-align: center; margin-top: 40px;">🚜 Arıza Kodlar</h1>
      <div class="machine-grid">
        <div class="machine-card" onclick="selectMachine('855')">
          <div class="machine-title">Nilfisk BR855 / BR755</div>
          <div class="machine-subtitle">Arıza Kodları ve Çözümleri</div>
        </div>
        <div class="machine-card" onclick="selectMachine('6000')">

          <div class="machine-subtitle">Arıza Kodları ve Çözümleri</div>
        </div>
        <div class="machine-card" onclick="selectMachine('6500')">
          <div class="machine-title">Nilfisk SC6500</div>
          <div class="machine-subtitle">Arıza Kodları ve Çözümleri</div>
        </div>
      </div>
    </div>

    <!-- 2. EKRAN: ARIZA KODLARI LİSTESİ (TABLO) -->

      <div class="header">
        <h1 id="selectedMachineTitle">Arıza Kodları</h1>
        <button class="btn-back" onclick="showSelectionScreen()">← Geri</button>
      </div>

      <input type="text" id="searchInput" class="search-box" placeholder="Kod veya arıza açıklaması yazın (Örn: 03 veya Fırça)..." onkeyup="searchErrors()">
      
      <table class="error-table">
        <thead>
          <tr>
            <th>Kod</th>
            <th>Açıklama ve Çözüm</th>
          </tr>
        </thead>
        <tbody id="resultsTableBody">
          <!-- Kodlar buraya dinamik dolacak -->
        </tbody>
      </table>
    </div>

  </div>

    // Makine Seçildiğinde Çalışacak Fonksiyon

      activeMachine = machineId;

      document.getElementById('detailScreen').classList.remove('hidden');
      document.getElementById('selectedMachineTitle').innerText = `Nilfisk ${machineId} Kodları`;
      document.getElementById('searchInput').value = ''; 
      
      displayErrors(database[machineId] || []);
    }

    // Seçim Ekranına Geri Dönüş
    function showSelectionScreen() {
      document.getElementById('detailScreen').classList.add('hidden');
      document.getElementById('selectionScreen').classList.remove('hidden');
    }

    // Kodları Tabloya Basma
    function displayErrors(data) {
      const tbody = document.getElementById('resultsTableBody');
      tbody.innerHTML = '';

      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="2" style="text-align:center; color:#94a3b8; padding:20px;">Bu makineye ait arıza kodu bulunamadı.</td></tr>';
        return;
      }

      data.forEach(item => {
        tbody.innerHTML += `
          <tr>
            <td class="code-cell">${item.code}</td>
            <td class="desc-cell">
              <div class="title">${item.title}</div>
              <div class="detail">${item.desc}</div>
            </td>
          </tr>
        `;
      });
    }

    // Makine İçi Arama
    function searchErrors() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const currentList = database[activeMachine] || [];
      
      const filtered = currentList.filter(item => 
        item.code.toLowerCase().includes(query) || 
        item.title.toLowerCase().includes(query) ||
        item.desc.toLowerCase().includes(query)
      );
      displayErrors(filtered);
    }

    // PWA Service Worker Kaydı
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log("PWA Servisi Aktif!"))
        .catch(err => console.log("PWA Hatası:", err));
    }
  </script>
</body>
</html>
